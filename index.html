<html lang="en"><head><meta charset="utf-8">

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Courier New",Courier,monospace}
#app{max-width:780px;margin:0 auto;padding:12px;position:relative;z-index:1}#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center bottom;background-repeat:no-repeat}#log{background:rgba(10,8,18,.94)}#hdr,#bst{text-shadow:0 0 4px #000,0 0 6px #000}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:1px}
.mu{color:var(--mu)}
.card{border:3px solid var(--ln);background:var(--pn);padding:8px;position:relative}
button{font:inherit;color:var(--fg);background:#000;border:3px solid var(--ln);padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--ye);color:#000;border-color:var(--ye)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ye)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}
.cls{cursor:pointer;text-align:left}
.cls.sel{border-color:var(--ye)!important;box-shadow:0 0 0 3px var(--ye)}
.cls b{font-size:16px}.cls small{display:block;color:var(--mu)}
.badge{position:absolute;top:6px;right:8px;color:var(--ye);font-weight:bold}
.names{display:grid;gap:6px;margin:10px 0}
.names label{display:flex;gap:8px;align-items:center}
input{font:inherit;background:#000;color:var(--fg);border:3px solid var(--ln);padding:6px;flex:1;min-width:0}
#game{display:none}
#hdr{display:flex;justify-content:space-between;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.e{flex:1;min-width:150px;text-align:center}
.e.boss{flex-basis:100%}
.dead{opacity:.3;filter:grayscale(1)}
.hp{height:20px;position:relative;background:#000;border:2px solid var(--ln);margin:4px 0}
.hp i{display:block;height:100%;background:var(--gr);transition:width .3s}.hp .pend{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#8dffc0 0 5px,#2fae6a 5px 10px);box-shadow:0 0 8px #7dffb0}
.e .hp i{background:var(--rd)}.hp span{position:absolute;inset:0;font-size:12px;line-height:16px;font-weight:bold;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}.ih{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:6px}.ic svg{vertical-align:middle;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}#dmg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:5px 9px;font-weight:bold;font-size:15px;color:#fff;border-left:6px solid #fff}.chip u{text-decoration:none;font-size:17px}.ce{background:#7a5600;border-color:var(--ye)}.cp{background:#8a1b2c;border-color:var(--rd)}.cb{background:#7a4510;border-color:var(--or)}.cg{background:#12633a;border-color:var(--gr)}.hp.mp.rdy{border-color:var(--ye);box-shadow:0 0 10px var(--ye)}.e .hp.mp i{background:#58a6ff}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.m{padding-top:20px}
.m.act{border-color:var(--ye)!important}.m.inv{border-style:dashed!important;box-shadow:0 0 12px #b08cff}
.m.targeted{border-color:var(--rd)!important;animation:pl .35s infinite alternate;background:#4a1020!important}
.m.targeted::before{content:"▼ TARGETED ▼";position:absolute;top:1px;left:0;right:0;text-align:center;color:var(--rd);font-weight:bold;font-size:12px}
.m.act::before{content:"▶ ACTING";position:absolute;top:1px;left:0;right:0;text-align:center;color:var(--ye);font-size:12px}
.m.dead::before{content:"FALLEN";position:absolute;top:1px;left:0;right:0;text-align:center;color:var(--mu);font-size:12px}
@keyframes pl{to{transform:translateY(-3px);box-shadow:0 0 14px var(--rd)}}
#sp{height:12px;background:#000;border:2px solid var(--ln);margin:2px 0 10px}

#msg{height:176px;overflow-y:auto;white-space:pre-line}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.bs{background:#9a1226;color:#fff;border-left:6px solid #ff4a5c;padding:7px 10px;margin:6px 0;font-weight:bold;font-size:16px}#aud{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}#aud button{padding:4px 8px;font-size:13px}
#tw{display:none;margin:8px 0}
#bar{position:relative;height:48px;background:#000;border:3px solid var(--ln);overflow:hidden}
.z{position:absolute;top:0;bottom:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.75)}.z.o{background:var(--or)}.z.g{background:var(--gr)}
#cur{position:absolute;top:0;bottom:0;width:.8%;min-width:3px;background:#fff;box-shadow:0 0 8px #fff}
#go{width:100%;margin-top:6px;padding:12px;font-weight:bold}
#res{text-align:center;font-size:22px;font-weight:bold;min-height:30px}
#menu{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media(max-width:560px){.party{grid-template-columns:1fr}.m{padding-top:20px}#app{padding:6px}#bar{height:64px}#go{padding:20px;font-size:18px}#msg{height:150px}}
@media(prefers-reduced-motion:reduce){.m.targeted{animation:none}}

 case'Demon':{let s=0;A.forEach(x=>{s+=dmgP(x,Math.max(1,Math.round(x.hp*.12)))});e.hp=Math.min(e.mh,e.hp+s);DM.push({s:e.nm,t:e,n:s,k:'h'});break}
 case'Void Sovereign':F.drift=2;R().stun=1;G.buff=0;G.prot=false;A.forEach(x=>x.inv=0);break}
 say(v?t[1].replace(/[Aa] hero/,v.nm):t[1]);flush();render();await sleep(1300)}
async function foes(){
 CUR='☠ Poison';clr();for(const e of alive(G.en))if(e.psn>0){e.psn--;hurt(e,8)}
 flush();if(DM.length)await sleep(1100);
 render();
 for(const e of G.en){
  if(e.hp>0&&e.stl){const rg=e.stl;e.stl=null;if(rg.hp>0){say(`🗝 ${rg.nm} steals ${e.nm}’s turn and acts in its place!`);render();await sleep(1000);await act(rg);if(!alive(G.en).length)return;await sleep(500);continue}}
  if(e.hp>0)e.mp=Math.min(e.mx,e.mp+(e.boss?15:20));
  if(e.hp>0&&e.hl>0){const h=Math.min(e.hl,e.mh-e.hp);e.hp+=h;e.hl=0;DM.push({s:e.nm,t:e,n:h,k:'h'});say(`🌿 ${e.nm} finishes regrowing and heals ${h} HP!`);render();await sleep(900)}
  if(e.hp>0&&e.stn>0){e.stn--;say(`💫 ${e.nm} is stunned and cannot act!`);render();await sleep(800);continue}
  if(e.hp>0&&alive(G.p).length&&alive(G.p).every(x=>x.inv>0)){if(e===alive(G.en)[0])say('👻 The enemies cannot see anyone!');continue}
  for(let n=0;n<(e.boss?2:1);n++){if(e.hp<=0||!alive(G.p).length)break;if(n==0&&e.mp>=e.mx&&!(e.burn>0)){await cast(e);continue}await foe(e,pk(e.at))}
  if(e.burn>0)e.burn--;if(!alive(G.p).length)return;if(e.hp>0)await sleep(1100);
 }
 $('#tw').style.display='none';
 for(const u of alive(G.p))if(u.psn>0){u.psn--;const pd=u.pd||6;u.hp=Math.max(0,u.hp-pd);if(u.psn<=0)u.pd=0;DM.push({s:'☠ Poison',t:u,n:pd,k:'p',r:'miss'});say(u.hp?`${u.nm} suffers ${pd} poison damage.`:`${u.nm} succumbs to poison!`)}
 G.p.forEach(u=>{u.guard=u.taunt=u.rip=u.dbl=false;if(u.weak>0)u.weak--;if(u.inv>0)u.inv--;['sil','mark','wk'].forEach(k=>{if(u[k]>0)u[k]--});if(!(u.weak>0))u.wt=false});G.prot=false;['chill','rage','haste'].forEach(k=>{if(G.fx[k]>0)G.fx[k]--});flush();render();
}
async function battle(){
 while(true){
  for(const u of alive(G.p)){if(!alive(G.en).length)return'w';if(u.stun>0){u.stun--;say(`💫 ${u.nm} is paralysed and loses the turn!`);render();await sleep(1100);continue}await act(u)}
  if(!alive(G.en).length)return'w';
  await sleep(1300);await foes();if(!alive(G.p).length)return'l';
 }
}
function spawn(){
 const A=AR[G.a],sc=1.3+.15*G.a;G.ds=1.6*(1+.1*G.a);let l;
 if(G.f==4)l=[A.b];else l=Array.from({length:Math.min(3,[1,2,2,3][G.f]+(G.a>1?1:0))},()=>pk(A.e));
 const cnt={};l.forEach(x=>cnt[x[0]]=(cnt[x[0]]||0)+1);const used={};
 G.en=l.map(x=>{let nm=x[0];if(cnt[nm]>1){used[nm]=(used[nm]||0)+1;nm+=' '+'ABC'[used[nm]-1]}const hp=Math.round(x[1]*sc*1.75*(G.f==4?.75:1));return{nm,bn:x[0],h:H[x[0]],hp,mh:hp,at:x[2],boss:G.f==4,psn:0,mx:x[0]=='Treant Elder'?150:100,mp:Math.round(rnd(15,45)),sp:G.f==4?BS[G.a]:TYS[[...x[0]].reduce((s,c)=>s+c.charCodeAt(0),0)%5]}});
}
async function run(){
 while(true){
  spawn();logs=[];clr();render();setBg(G.a);mus((G.f==4?'b':'a')+G.a);say(`${G.f==4?'BOSS FIGHT! ':''}${G.en.map(e=>e.nm).join(', ')} appear${G.en.length>1?'':'s'}!`);await sleep(1100);
  if(G.f==4){yell(G.en[0],'s');await sleep(1700)}const r=await battle();$('#tw').style.display='none';
  if(r=='l'){sfx('lose');say('Your party has been wiped out.');await menu([{id:1,l:'Try again'}]);location.reload();return}
  G.p.forEach(u=>{u.psn=0;u.act=u.guard=u.taunt=u.rip=u.wt=false;u.weak=u.inv=u.sil=u.mark=u.stun=u.wk=0;u.exh=false;if(u.hp>0)u.hp=u.mh});G.sp=10;G.buff=0;G.prot=false;G.fx={drift:0,chill:0,fog:0,rage:0,haste:0};render();
  if(G.f==4){
   if(G.a==4){sfx('win');say(`VICTORY! The Void Sovereign falls.\nSurvivors: ${alive(G.p).map(u=>u.nm).join(', ')} (${alive(G.p).length}/3)`);await menu([{id:1,l:'Play again'}]);location.reload();return}
   
   sfx('win');say(`${AR[G.a].n} cleared! Choose one hero to upgrade.`);render();{const o=alive(G.p).filter(u=>LV(u)<2);if(o.length){const id=await menu(o.map(u=>({id:G.p.indexOf(u),l:upTxt(u)})));const u=G.p[id];doUp(u);say(`⬆ ${u.nm} becomes a ${u.tt}!`)}}render();await menu([{id:1,l:`Enter ${AR[G.a+1].n} ▶`}]);G.a++;G.f=0;
  }else{sfx('win');say('Victory! The party recovers fully.');await menu([{id:1,l:'Next fight ▶'}]);G.f++}
 }
}
setup();
</script></body></html>
