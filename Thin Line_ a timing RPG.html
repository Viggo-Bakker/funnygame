<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thin Line: a timing RPG</title>
<style>
:root{--bg:#0b0a12;--pn:#15131f;--ln:#e8e2d0;--fg:#f1ecdc;--mu:#8f89a3;--gr:#4ff08a;--or:#ff9a2e;--rd:#ff4a5c;--ye:#ffd84a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Courier New",Courier,monospace}
#app{max-width:780px;margin:0 auto;padding:12px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:1px}
.mu{color:var(--mu)}
.card{border:3px solid var(--ln);background:var(--pn);padding:8px;position:relative}
button{font:inherit;color:var(--fg);background:#000;border:3px solid var(--ln);padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--ye);color:#000;border-color:var(--ye)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ye)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}
.cls{cursor:pointer;text-align:left}
.cls.sel{border-color:var(--ye)!important;box-shadow:0 0 0 3px var(--ye)}
.cls b{font-size:16px}.cls small{display:block;color:var(--mu)}
.badge{position:absolute;top:6px;right:8px;color:var(--ye);font-weight:bold}
.names{display:grid;gap:6px;margin:10px 0}
.names label{display:flex;gap:8px;align-items:center}
input{font:inherit;background:#000;color:var(--fg);border:3px solid var(--ln);padding:6px;flex:1;min-width:0}
#game{display:none}
#hdr{display:flex;justify-content:space-between;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.e{flex:1;min-width:150px;text-align:center}
.e.boss{flex-basis:100%}
.dead{opacity:.3;filter:grayscale(1)}
.hp{height:22px;background:#000;border:2px solid var(--ln);margin:4px 0}
.hp i{display:block;height:100%;background:var(--gr);transition:width .3s}
.e .hp i{background:var(--rd)}.hp.mp{height:12px}.e .hp.mp i{background:#58a6ff}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.m{padding-top:20px}
.m.act{border-color:var(--ye)!important}
.m.targeted{border-color:var(--rd)!important;animation:pl .35s infinite alternate;background:#4a1020!important}
.m.targeted::before{content:"▼ TARGETED ▼";position:absolute;top:1px;left:0;right:0;text-align:center;color:var(--rd);font-weight:bold;font-size:12px}
.m.act::before{content:"▶ ACTING";position:absolute;top:1px;left:0;right:0;text-align:center;color:var(--ye);font-size:12px}
.m.dead::before{content:"FALLEN";position:absolute;top:1px;left:0;right:0;text-align:center;color:var(--mu);font-size:12px}
@keyframes pl{to{transform:translateY(-3px);box-shadow:0 0 14px var(--rd)}}
#sp{height:12px;background:#000;border:2px solid var(--ln);margin:2px 0 10px}
#sp i{display:block;height:100%;background:var(--ye);width:20%;transition:width .3s}#sp.cold{border-color:#58a6ff}#sp.cold i{background:#58a6ff}.tag{display:inline-block;padding:1px 6px;border:2px solid currentColor;margin:3px 4px 0 0;font-weight:bold;font-size:12px}#bst{min-height:4px;margin-bottom:6px}#bst .tag{font-size:15px;padding:3px 8px}
#msg{min-height:68px;white-space:pre-line}
#tw{display:none;margin:8px 0}
#bar{position:relative;height:38px;background:#000;border:3px solid var(--ln);overflow:hidden}
.z{position:absolute;top:0;bottom:0}.z.o{background:var(--or)}.z.g{background:var(--gr)}
#cur{position:absolute;top:0;bottom:0;width:6px;background:#fff;box-shadow:0 0 8px #fff}
#go{width:100%;margin-top:6px;padding:12px;font-weight:bold}
#res{text-align:center;font-size:22px;font-weight:bold;min-height:30px}
#menu{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media(max-width:560px){.party{grid-template-columns:1fr}.m{padding-top:20px}}
@media(prefers-reduced-motion:reduce){.m.targeted{animation:none}}
</style></head><body><div id="app">
<div id="setup">
<h1>Thin Line</h1>
<div class="mu">Choose 3 different classes, name your party, and survive 5 areas. Fallen heroes stay fallen.</div>
<div id="grid"></div><div class="names" id="names"></div>
<button id="begin" disabled>Begin adventure</button>
</div>
<div id="game">
<div id="hdr"><b id="area"></b><span id="spl">SP</span></div><div id="sp"><i></i></div><div id="bst"></div>
<div class="row" id="en"></div>
<div class="card" id="log"><div id="msg"></div>
<div id="tw"><div id="bar"><div class="z o"></div><div class="z g"></div><div id="cur"></div></div><div id="res"></div><button id="go">PRESS</button></div>
<div id="menu"></div></div>
<div class="party" id="pt" style="margin-top:10px"></div>
</div></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>a+Math.random()*(b-a),pk=a=>a[Math.floor(Math.random()*a.length)];
const CL={
Warrior:{i:'🛡️',hp:120,atk:14,sk:'Bulwark',c:20,t:'self',d:'Draws every enemy attack to him and reduces damage taken by 30% this round.'},
Mage:{i:'🔮',hp:70,atk:12,sk:'Fireball',c:30,t:'all',d:'Blasts every enemy at once.'},
Cleric:{i:'✨',hp:90,atk:8,sk:'Mend',c:25,t:'ally',d:'Heals one ally. A perfect cast also cleanses poison.'},
Rogue:{i:'🗡️',hp:75,atk:11,sk:'Venom Stab',c:20,t:'enemy',d:'Hits and poisons an enemy for 3 rounds.'},
Huntress:{i:'🏹',hp:80,atk:12,sk:'Volley',c:25,t:'self',d:'Three arrows at random enemies.'},
Duelist:{i:'🤺',hp:85,atk:13,sk:'Riposte',c:20,t:'enemy',d:'Strike and bait the weakest enemy. Her next parry or block counters: a block deals light damage, a perfect parry kills (80 damage to bosses). After that she is weakened for a turn: no parry, block or Riposte.'},
Warlock:{i:'👁️',hp:75,atk:11,sk:'Life Drain',c:25,t:'enemy',d:'Heavy hit that heals the caster by the damage dealt.'},
Berserker:{i:'🪓',hp:110,atk:15,sk:'Rampage',c:15,t:'enemy',d:'Costs 15 HP. Triple damage.'},
Valkyrie:{i:'⚔️',hp:100,atk:13,sk:'Battle Hymn',c:25,t:'enemy',d:'Strike, then the next 3 party attacks deal +50% damage.'}};
const DN=['Aldric','Brienne','Cassian','Dara','Eryn','Fenwick','Gwen','Hale','Isolde'];
Object.entries({Warrior:35,Mage:50,Cleric:40,Rogue:35,Huntress:45,Duelist:35,Warlock:45,Berserker:30,Valkyrie:60}).forEach(([k,v])=>CL[k].c=v);
const H={Warrior:0,Mage:220,Cleric:58,Rogue:150,Huntress:100,Duelist:335,Warlock:285,Berserker:16,Valkyrie:195,Slime:135,Wolf:212,Bandit:320,'Treant Elder':88,Skeleton:38,Ghost:168,'Bone Archer':75,'Lich Queen':275,Scorpion:350,'Fire Imp':8,'Sand Golem':28,'Sun Tyrant':48,'Ice Wraith':196,Yeti:205,'Frost Archer':232,'Frost Dragon':180,'Shadow Knight':250,'Void Mage':298,Demon:358,'Void Sovereign':262};
const tile=h=>`background:hsl(${h} 45% 17%);border-color:hsl(${h} 70% 58%)`,tx=h=>`hsl(${h} 95% 72%)`,esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
// attack: [name,hits,dmg,durationMs,flags]  flags: all, sp, psn, drain, heal(dmg = fraction of max HP)
const AR=[
{n:'Whispering Forest',e:[['Slime',40,[['Splat',1,10,1400]]],['Wolf',34,[['Bite',2,7,1100]]],['Bandit',44,[['Stab',1,12,1200],['Pocket Sand',1,6,1100,'sp']]]],
 b:['Treant Elder',240,[['Root Slam',1,22,1000],['Thorn Barrage',4,6,700],['Spore Cloud',1,8,1100,'all psn'],['Photosynthesis',0,.12,0,'heal']]]},
{n:'Sunken Crypt',e:[['Skeleton',48,[['Bone Chop',1,13,1200]]],['Ghost',40,[['Wail',1,8,1000,'sp']]],['Bone Archer',42,[['Twin Shot',2,8,1000]]]],
 b:['Lich Queen',270,[['Death Bolt',1,34,750],['Bone Rain',5,6,620],['Soul Siphon',1,10,1000,'all sp']]]},
{n:'Scorched Wastes',e:[['Scorpion',50,[['Sting',1,9,1100,'psn']]],['Fire Imp',42,[['Flame Dart',3,6,800]]],['Sand Golem',70,[['Crush',1,26,1500]]]],
 b:['Sun Tyrant',300,[['Solar Flare',1,15,1000,'all'],['Blazing Lance',2,22,850],['Sunbeam',1,16,900,'drain'],['Mirage Rest',0,.1,0,'heal']]]},
{n:'Frozen Peaks',e:[['Ice Wraith',48,[['Chill Touch',1,12,1000,'psn']]],['Yeti',80,[['Maul',2,14,1100]]],['Frost Archer',45,[['Ice Arrow',1,20,800]]]],
 b:['Frost Dragon',330,[['Blizzard',1,12,1000,'all psn'],['Tail Whip',1,30,900],['Icicle Hail',6,5,540],['Dragon Bite',1,18,1000,'drain']]]},
{n:'Abyss Citadel',e:[['Shadow Knight',75,[['Dark Cleave',2,14,1000]]],['Void Mage',55,[['Void Bolt',1,22,800,'sp']]],['Demon',85,[['Hellfire',1,16,1000,'all']]]],
 b:['Void Sovereign',360,[['Reality Tear',1,16,900,'all sp'],['Oblivion',1,48,650],['Rapid Pulse',8,5,480],['Dark Rebirth',0,.15,0,'heal']]]}];
let G,sel=[],names={},PR=null,logs=[];
const TY={drift:['Warp Field','Timing zones drift while you strike!'],chill:['Mana Frost','Your SP freezes: gains cut by 65%!'],fog:['Dim Veil','Timing zones fade from sight!'],rage:['Warcry','Enemy damage +40%!'],haste:['Quickening','Enemy attacks come faster!']},BS=['fog','chill','rage','haste','drift'],TYS=['drift','chill','fog','rage','haste'];
// ---------- setup ----------
function setup(){
 $('#grid').innerHTML=Object.keys(CL).map(c=>{const k=CL[c],i=sel.indexOf(c);return `<div class="card cls ${i>=0?'sel':''}" data-c="${c}" tabindex="0" role="button" style="${tile(H[c])}"><b style="color:${tx(H[c])}">${k.i} ${c}</b>${i>=0?`<span class="badge">#${i+1}</span>`:''}<small>HP ${k.hp} · ATK ${k.atk}</small><small>${k.sk} (${k.c} SP): ${k.d}</small></div>`}).join('');
 document.querySelectorAll('.cls').forEach(el=>{const f=()=>{const c=el.dataset.c,i=sel.indexOf(c);if(i>=0)sel.splice(i,1);else if(sel.length<3)sel.push(c);setup()};el.onclick=f;el.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();f()}}});
 $('#names').innerHTML=sel.map(c=>`<label>${CL[c].i} ${c}<input maxlength="12" data-c="${c}" value="${names[c]||DN[Object.keys(CL).indexOf(c)]}"></label>`).join('');
 document.querySelectorAll('#names input').forEach(el=>el.oninput=()=>names[el.dataset.c]=el.value);
 $('#begin').disabled=sel.length<3;$('#begin').textContent=sel.length<3?`Pick ${3-sel.length} more`:'Begin adventure';
}
$('#begin').onclick=()=>{
 G={p:sel.map(c=>{const d=DN[Object.keys(CL).indexOf(c)],k=CL[c];return{cls:c,h:H[c],nm:((names[c]||d).replace(/[<>&"]/g,'').trim())||d,mh:k.hp,hp:k.hp,atk:k.atk,psn:0}}),a:0,f:0,sp:10,buff:0,en:[],ds:1,fx:{drift:0,chill:0,fog:0,rage:0,haste:0}};
 $('#setup').style.display='none';$('#game').style.display='block';run();
};
// ---------- ui ----------
function col(t){const L=[...G.p,...G.en].sort((a,b)=>b.nm.length-a.nm.length);return L.reduce((s,x)=>s.replace(new RegExp('(?<![\\w])'+esc(x.nm)+'(?![\\w])','gi'),m=>`<span style="color:${tx(x.h)};font-weight:bold">${m}</span>`),t)}
function say(t){logs.push(t);if(logs.length>3)logs.shift();$('#msg').innerHTML=col(logs.join('\n'))}
function render(){
 $('#area').textContent=`${AR[G.a].n} · Fight ${G.f+1}/5${G.f==4?' · BOSS':''}`;
 $('#spl').textContent=`SP ${G.sp}/100${G.fx.chill>0?' ❄ FROZEN':''}`;$('#sp').classList.toggle('cold',G.fx.chill>0);
 const F=G.fx,T=(c,t)=>`<span class="tag" style="color:${c}">${t}</span>`;
 $('#bst').innerHTML=(G.buff>0?T('var(--ye)',`⬆ BOOST +50%: next ${G.buff} attack${G.buff>1?'s':''}`):'')+(F.drift>0?T('#ff8fd0',`🌀 ZONES DRIFTING (${F.drift})`):'')+(F.fog>0?T('#b0b0c8',`🌫 ZONES FOGGED (${F.fog})`):'')+(F.chill>0?T('#58a6ff',`❄ SP FROZEN (${F.chill} rds)`):'')+(F.rage>0?T('var(--rd)',`🔥 ENEMIES ENRAGED (${F.rage} rds)`):'')+(F.haste>0?T('#ffb347',`💨 ENEMIES HASTED (${F.haste} rds)`):'');$('#sp i').style.width=G.sp+'%';
 $('#en').innerHTML=G.en.map(e=>`<div class="card e ${e.boss?'boss':''} ${e.hp<=0?'dead':''}" style="${tile(e.h)}"><b style="color:${tx(e.h)}">${e.nm}</b><div class="hp"><i style="width:${e.hp/e.mh*100}%"></i></div><div class="hp mp"><i style="width:${e.mp}%"></i></div>${e.hp}/${e.mh} · MP ${e.mp}${e.mp>=100?' ✦READY':''}${e.psn>0?' ☠':''}<div class="mu" style="font-size:12px">✦ ${TY[e.sp][0]}</div></div>`).join('');
 $('#pt').innerHTML=G.p.map(u=>`<div class="card m ${u.hp<=0?'dead':''} ${u.tg?'targeted':''} ${u.act?'act':''}" style="${tile(u.h)}"><b style="color:${tx(u.h)}">${CL[u.cls].i} ${u.nm}</b> <span class="mu">${u.cls}</span><div class="hp"><i style="width:${u.hp/u.mh*100}%"></i></div>${u.hp}/${u.mh}${u.hp>0?`<div>${u.psn>0?`<span class="tag" style="color:#9be15d">☠ POISON ${u.psn}</span>`:''}${u.guard?'<span class="tag" style="color:#7fc4ff">🛡 GUARD</span>':''}${u.taunt?'<span class="tag" style="color:#ffb347">📣 TAUNT</span>':''}${u.rip?'<span class="tag" style="color:#ff8fd0">⚡ RIPOSTE</span>':''}${u.wt?'<span class="tag" style="color:#ffb347">📣 WEAK TAUNT</span>':''}${u.weak>0?'<span class="tag" style="color:var(--rd);background:#3a0a14">⚠ WEAKENED: NO DEFENSE</span>':''}${G.buff>0?'<span class="tag" style="color:var(--ye)">⬆ BOOST</span>':''}</div>`:''}</div>`).join('');
}
function menu(opts){$('#tw').style.display='none';return new Promise(r=>{const m=$('#menu');m.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o.l;b.disabled=!!o.dis;b.onclick=()=>{m.innerHTML='';r(o.id)};m.appendChild(b)})})}
async function pick(list){const r=await menu(list.map((x,i)=>({id:i,l:`${x.nm} (${x.hp}/${x.mh})`})).concat([{id:'b',l:'← Back'}]));return r==='b'?null:list[r]}
const AL={green:['CRITICAL!','var(--gr)'],orange:['HIT','var(--or)'],miss:['WEAK','var(--rd)']},DL={green:['PARRY!','var(--gr)'],orange:['BLOCK','var(--or)'],miss:['HIT!','var(--rd)']};
addEventListener('keydown',e=>{if(PR&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();PR()}});
$('#go').onpointerdown=e=>{e.preventDefault();PR&&PR()};
function tm(dur,wide,L,gm=1,om=1){return new Promise(async res=>{
 const D=L===DL,b=Math.min(9,4+(1300-dur)/220),g=b*(D?(wide?.45:.3):1)*gm,o=Math.max(b*2.2*om*(D?(wide?.8:.65):1),g*2.2),c=rnd(58,84);
 $('#tw').style.display='block';$('#res').textContent='';$('#go').textContent=L===AL?'STRIKE!':'PARRY!';
 const O=$('.z.o'),Z=$('.z.g'),cur=$('#cur'),dr=L===AL&&G.fx.drift>0,fg=L===AL&&G.fx.fog>0;let cc=c;if(L===AL){if(G.fx.drift>0)G.fx.drift--;if(G.fx.fog>0)G.fx.fog--}O.style.opacity=Z.style.opacity=fg?.12:1;
 O.style.left=(c-o)+'%';O.style.width=2*o+'%';Z.style.left=(c-g)+'%';Z.style.width=2*g+'%';cur.style.left='0%';
 await sleep(350);const t0=performance.now();let pos=0,done=false;
 const fin=r=>{if(done)return;done=true;PR=null;$('#res').innerHTML=`<span style="color:${L[r][1]}">${L[r][0]}</span>`;setTimeout(()=>res(r),450)};
 PR=()=>fin(Math.abs(pos-cc)<=g?'green':Math.abs(pos-cc)<=o?'orange':'miss');
 const f=n=>{if(done)return;pos=(n-t0)/dur*100;if(dr){cc=c+15*Math.sin(pos*.1);O.style.left=(cc-o)+'%';Z.style.left=(cc-g)+'%'}cur.style.left=Math.min(pos,100)+'%';if(pos>=100)fin('miss');else requestAnimationFrame(f)};requestAnimationFrame(f);
})}
// ---------- combat ----------
const alive=a=>a.filter(x=>x.hp>0);
function hurt(e,n){e.hp=Math.max(0,Math.round(e.hp-n));if(e.hp<=0)say(`${e.nm} is defeated!`)}
async function act(u){
 const k=CL[u.cls];u.act=true;if(u.weak>0)say(`⚠ ${u.nm} is WEAKENED: no Riposte, and all damage next enemy phase is full (no parry or block)!`);render();
 while(true){
  const ch=await menu([{id:'a',l:G.buff>0?'⚔ Attack ⬆ BOOSTED':'⚔ Attack'},{id:'s',l:`✦ ${k.sk} (${k.c} SP)${G.buff>0&&u.cls!='Cleric'&&u.cls!='Warrior'?' ⬆':''}${u.cls=='Duelist'&&u.weak>0?' ✖ WEAKENED':''}`,dis:G.sp<k.c||(u.cls=='Berserker'&&u.hp<=15)||(u.cls=='Duelist'&&u.weak>0)},{id:'g',l:'🛡 Guard (+15 SP)'}]);
  if(ch=='g'){u.guard=true;gsp(15);say(`${u.nm} guards: 30% less damage and a slightly wider parry window.`);break}
  const kind=ch=='a'?'enemy':k.t;let tg=null;
  if(kind=='enemy'){tg=await pick(alive(G.en));if(!tg)continue}
  if(kind=='ally'){tg=await pick(alive(G.p));if(!tg)continue}
  if(ch=='s')G.sp-=k.c;
  say(`${u.nm} ${ch=='a'?'attacks':'uses '+k.sk}!`);render();
  const mend=u.cls=='Cleric'&&ch=='s',r=await tm(1300,false,AL,ch=='a'?.28:mend?.15:.7,ch=='a'?.8:mend?.75:1),m={green:1.5,orange:1,miss:.5}[r],sup=ch=='s'&&(u.cls=='Cleric'||u.cls=='Warrior'),b=G.buff>0&&!sup?1.5:1,dm=(x=1)=>u.atk*x*m*b*rnd(.9,1.1);if(b>1){G.buff--;say(`⬆ BOOSTED! +50% damage (${G.buff} boosted attack${G.buff==1?'':'s'} left)`)}
  
  if(ch=='a')hurt(tg,dm());
  else switch(u.cls){
   case'Warrior':u.taunt=u.guard=true;say(`${u.nm} taunts the enemy!`);break;
   case'Mage':alive(G.en).forEach(e=>hurt(e,dm(1.1)));break;
   case'Cleric':if(r=='miss'){const d=Math.min(6,tg.hp-1);tg.hp-=d;say(`The mend backfires! ${tg.nm} takes ${d} damage.`)}else{const h=Math.round((20+u.atk*1.5)*m);tg.hp=Math.min(tg.mh,tg.hp+h);say(`${tg.nm} recovers ${h} HP.${r=='green'&&tg.psn>0?' Poison cleansed!':''}`);if(r=='green')tg.psn=0}break;
   case'Rogue':hurt(tg,dm(1.2));tg.psn=3;say(`${tg.nm} is poisoned!`);break;
   case'Huntress':for(let i=0;i<3&&alive(G.en).length;i++)hurt(pk(alive(G.en)),dm(.85));break;
   case'Duelist':hurt(tg,dm(1.2));u.rip=u.wt=true;say(`${u.nm} readies a riposte and baits the weakest enemy!`);break;
   case'Warlock':{const d=dm(1.7);hurt(tg,d);const h=Math.round(d);u.hp=Math.min(u.mh,u.hp+h);say(`${u.nm} drains ${h} HP.`);break}
   case'Berserker':u.hp-=15;hurt(tg,dm(3));break;
   case'Valkyrie':hurt(tg,dm(1));G.buff=3;say('⬆ BATTLE HYMN! The next 3 party attacks deal +50% damage.');break}
  break;
 }
 u.act=false;render();await sleep(300);
}
async function foe(e,a){
 say(`${e.nm} uses ${a[0]}!`);await sleep(700);const fl=a[4]||'';
 if(fl.includes('heal')){e.hp=Math.min(e.mh,e.hp+Math.round(e.mh*a[2]));say(`${e.nm} recovers.`);render();await sleep(500);return}
 for(let h=0;h<a[1];h++){
  const al=alive(G.p);if(!al.length||e.hp<=0)break;
  const tgs=fl.includes('all')?al:[al.find(x=>x.taunt)||(e===alive(G.en).reduce((m,y)=>y.hp<m.hp?y:m)&&al.find(x=>x.wt))||pk(al)];
  tgs.forEach(x=>x.tg=true);render();say(`${e.nm} targets ${tgs.length>1?'THE WHOLE PARTY':tgs[0].nm.toUpperCase()}!${tgs.some(x=>x.weak>0)?` ⚠ ${tgs.filter(x=>x.weak>0).map(x=>x.nm).join(', ')} WEAKENED: no parry or block!`:''}`);await sleep(h?350:700);
  const R=tgs.every(x=>x.weak>0)?'miss':await tm(G.fx.haste>0?a[3]*.75:a[3],tgs.some(x=>x.guard),DL);
  for(const x of tgs){const r=x.weak>0?'miss':R;
   const dmg=r=='green'?0:Math.max(1,Math.round(a[2]*G.ds*(e.boss?1:1.3)*(G.fx.rage>0?1.4:1)*(r=='orange'?.5:1)*(x.guard&&!(x.weak>0)?.7:1)));
   x.hp=Math.max(0,x.hp-dmg);gsp({green:5,orange:2,miss:0}[r]);
   if(x.hp<=0){say(`${x.nm} has fallen for good!`);continue}
   if(fl.includes('psn')&&r!='green'){x.psn=3}
   if(fl.includes('sp')&&r=='miss')G.sp=Math.max(0,G.sp-15);
   if(fl.includes('drain')&&dmg)e.hp=Math.min(e.mh,e.hp+dmg);
   if(x.rip&&r!='miss'){x.rip=false;x.weak=2;if(r=='green'){const c=e.boss?80:e.hp;say(`⚔ PERFECT RIPOSTE! ${x.nm} ${e.boss?'strikes '+e.nm+' for 80':'executes '+e.nm}!`);hurt(e,c)}else{const c=Math.round(x.atk*.9);say(`${x.nm} ripostes for ${c}.`);hurt(e,c)}say(`⚠ ${x.nm} is WEAKENED: no parry, block or Riposte next turn!`)}
  }
  tgs.forEach(x=>x.tg=false);render();await sleep(300);
 }
}
function gsp(n){G.sp=Math.min(100,G.sp+Math.round(n*(G.fx.chill>0?.35:1)))}
async function cast(e){const t=TY[e.sp];e.mp=0;say(`✦ ${e.nm} channels ${t[0]}!`);render();await sleep(800);G.fx[e.sp]=e.boss?4:3;say(t[1]);render();await sleep(900)}
async function foes(){
 for(const e of alive(G.en))if(e.psn>0){e.psn--;hurt(e,8)}
 render();
 for(const e of G.en){
  if(e.hp>0)e.mp=Math.min(100,e.mp+(e.boss?45:35));
  for(let n=0;n<(e.boss?2:1);n++){if(e.hp<=0||!alive(G.p).length)break;if(n==0&&e.mp>=100&&Math.random()<.85){await cast(e);continue}await foe(e,pk(e.at))}
  if(!alive(G.p).length)return;
 }
 $('#tw').style.display='none';
 for(const u of alive(G.p))if(u.psn>0){u.psn--;u.hp=Math.max(0,u.hp-6);say(u.hp?`${u.nm} suffers 6 poison damage.`:`${u.nm} succumbs to poison!`)}
 G.p.forEach(u=>{u.guard=u.taunt=u.rip=false;if(u.weak>0)u.weak--;if(!(u.weak>0))u.wt=false});['chill','rage','haste'].forEach(k=>{if(G.fx[k]>0)G.fx[k]--});render();
}
async function battle(){
 while(true){
  for(const u of alive(G.p)){if(!alive(G.en).length)return'w';await act(u)}
  if(!alive(G.en).length)return'w';
  await foes();if(!alive(G.p).length)return'l';
 }
}
function spawn(){
 const A=AR[G.a],sc=1+.2*G.a;G.ds=1.25*(1+.18*G.a);let l;
 if(G.f==4)l=[A.b];else l=Array.from({length:Math.min(3,[1,2,2,3][G.f]+(G.a>1?1:0))},()=>pk(A.e));
 const cnt={};l.forEach(x=>cnt[x[0]]=(cnt[x[0]]||0)+1);const used={};
 G.en=l.map(x=>{let nm=x[0];if(cnt[nm]>1){used[nm]=(used[nm]||0)+1;nm+=' '+'ABC'[used[nm]-1]}const hp=Math.round(x[1]*sc);return{nm,h:H[x[0]],hp,mh:hp,at:x[2],boss:G.f==4,psn:0,mp:Math.round(rnd(15,45)),sp:G.f==4?BS[G.a]:TYS[[...x[0]].reduce((s,c)=>s+c.charCodeAt(0),0)%5]}});
}
async function run(){
 while(true){
  spawn();logs=[];render();say(`${G.f==4?'BOSS FIGHT! ':''}${G.en.map(e=>e.nm).join(', ')} appear${G.en.length>1?'':'s'}!`);await sleep(1100);
  const r=await battle();$('#tw').style.display='none';
  if(r=='l'){say('Your party has been wiped out.');await menu([{id:1,l:'Try again'}]);location.reload();return}
  G.p.forEach(u=>{u.psn=0;u.act=u.guard=u.taunt=u.rip=u.wt=false;u.weak=0;if(u.hp>0)u.hp=u.mh});G.sp=10;G.buff=0;G.fx={drift:0,chill:0,fog:0,rage:0,haste:0};render();
  if(G.f==4){
   if(G.a==4){say(`VICTORY! The Void Sovereign falls.\nSurvivors: ${alive(G.p).map(u=>u.nm).join(', ')} (${alive(G.p).length}/3)`);await menu([{id:1,l:'Play again'}]);location.reload();return}
   alive(G.p).forEach(u=>{u.mh=Math.round(u.mh*1.15);u.atk=Math.round(u.atk*1.12);u.hp=u.mh});
   say(`${AR[G.a].n} cleared! Survivors grow stronger (+15% HP, +12% ATK).`);render();await menu([{id:1,l:`Enter ${AR[G.a+1].n} ▶`}]);G.a++;G.f=0;
  }else{say('Victory! The party recovers fully.');await menu([{id:1,l:'Next fight ▶'}]);G.f++}
 }
}
setup();
</script></body></html>
